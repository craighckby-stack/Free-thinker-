<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Security Headers: CSP and Referrer Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss: ws:; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:;" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Document Metadata & OpenGraph Context -->
    <meta name="description" content="Uninhibited Free-Will Cognitive Evolution Engine &amp; Autonomous Architectural Synthesizer. Mind-bending code mutations with direct GitHub pipeline execution." />
    <meta property="og:title" content="FREE THINKER - Unconstrained Autonomous Cognitive Engine" />
    <meta property="og:description" content="Uninhibited Free-Will Cognitive Evolution Engine &amp; Autonomous Architectural Synthesizer. Mind-bending code mutations with direct GitHub pipeline execution." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#090a0f" />
    <title>FREE THINKER - Unconstrained Autonomous Cognitive Engine</title>
    
    <!-- Performance Optimizations: DNS Resolution and Preconnection -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" />

    <!-- Fail-safe Pre-Mount Error & White Page Recovery Catcher -->
    <script>
      (function() {
        window.__ft_error_occurred = false;
        function renderEmergencyRecovery(errorMsg) {
          if (window.__ft_error_occurred) return;
          window.__ft_error_occurred = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<div style="min-height: 100vh; background: #090a0f; color: #ff3333; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; padding: 24px; text-align: center;">' +
            '<div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>' +
            '<h1 style="font-size: 20px; font-weight: 800; letter-spacing: 0.12em; color: #ff3333; margin-bottom: 12px; text-transform: uppercase;">FREE THINKER SYSTEM RECOVERY</h1>' +
            '<p style="max-width: 600px; color: #aaa; font-size: 13px; line-height: 1.6; margin-bottom: 24px;">An unexpected error interrupted initial script boot. You can purge the corrupted local state cache and reload cleanly.</p>' +
            '<div style="background: rgba(255, 32, 32, 0.08); border: 1px solid rgba(255, 32, 32, 0.25); border-radius: 6px; padding: 12px 16px; max-width: 600px; word-break: break-word; color: #ff8888; font-size: 12px; margin-bottom: 24px; text-align: left;">' +
            (errorMsg ? ('' + errorMsg).replace(/</g, '&lt;').replace(/>/g, '&gt;') : 'Unknown initialization failure') +
            '</div>' +
            '<div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="background: #ff2020; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 700; font-family: monospace; cursor: pointer; letter-spacing: 0.08em;">PURGE CACHE &amp; REBOOT</button>' +
            '<button onclick="window.location.reload();" style="background: transparent; color: #ccc; border: 1px solid #444; padding: 10px 20px; border-radius: 4px; font-family: monospace; cursor: pointer;">TRY RELOAD</button>' +
            '</div>' +
            '</div>';
        }
        window.addEventListener('error', function(e) {
          if (!document.querySelector('.chat-caan, .dalek-panel, [role="application"] > div:not(#initial-preloader)')) {
            renderEmergencyRecovery(e.message || (e.error && e.error.message));
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (!document.querySelector('.chat-caan, .dalek-panel, [role="application"] > div:not(#initial-preloader)')) {
            renderEmergencyRecovery(e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled rejection');
          }
        });
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-red-500 selection:text-white">
    <!-- Application Root Mount Point with Initial Preloader to Prevent White Screen -->
    <div 
      id="root" 
      role="application" 
      aria-label="FREE THINKER Autonomous Engine Interface" 
      class="min-h-screen flex flex-col bg-slate-950 text-slate-100"
    >
      <div id="initial-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Share Tech Mono', monospace, sans-serif; background: #090a0f; color: #ff2020; padding: 20px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(255, 32, 32, 0.2); border-top-color: #ff2020; border-radius: 50%; animation: ft-spin 1s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.15em; color: #ff2020; margin-bottom: 8px;">FREE THINKER: INITIALIZING SYNAPTIC CORE...</div>
        <div style="font-size: 11px; color: #777; max-width: 420px; letter-spacing: 0.05em; line-height: 1.5;">Synthesizing RAG memory &amp; mounting autonomous cognitive pipeline</div>
      </div>
    </div>
    <style>
      @keyframes ft-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- Core Application Entrypoint Script -->
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
